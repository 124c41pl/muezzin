[project]
name = "muezzin"
version = "0.1.2"
description = "Prayer times and audio for your speakers - any calculation method, any speaker. Config-first, self-hosted."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
    "pychromecast>=13.0",
    "zeroconf>=0.130",
    "PyYAML>=6.0",
    # Windows has no system tz database; zoneinfo needs this for IANA zone names
    "tzdata>=2024.1; sys_platform == 'win32'",
]
# Where this is expected to work. The test suite runs on all three, because the
# only operating-system-specific part of the program is which player gets asked
# for sound - see src/muezzin/localplay.py.
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Home Automation",
]

[project.optional-dependencies]
# microphone / loopback capture and non-Windows playback experiments
audio = ["PyAudioWPatch>=0.2.12"]
# test-only: an independent implementation used purely as a cross-check oracle
dev = ["pytest>=8", "adhan==0.1.1"]

[project.scripts]
muezzin = "muezzin.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
# Where the tests live. Without this, `pytest` with no arguments also walks any
# scratch copy of the repo in the working directory, and two files both named
# test_calc.py in different folders make collection die with a confusing
# "use a unique basename" hint before a single test has run.
testpaths = ["tests"]

# A test that blocks instead of failing would sit until CI's own time limit and
# tell us nothing at all. faulthandler is standard library, so no dependency is
# added: after this many seconds of silence it dumps the stack of every thread,
# which names the test and the line it is stuck on. First use: the macOS job,
# which on 2026-11-12 had been inside the suite for half an hour while Linux
# and Windows finished theirs in under a minute.
faulthandler_timeout = 120
