# The test suite is the contract: arithmetic, the YAML interface, the page's
# guards. None of it needs a speaker, a network or a Docker daemon, so it runs on
# a plain runner.
name: tests

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  pytest:
    name: pytest (${{ matrix.os }}, python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Windows matters on its own: the daemon's most common host, it has no
        # system tzdata, and path containment is case-insensitive there.
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.12"]
        exclude:
          - os: windows-latest
            python-version: "3.10"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .[dev]
      - name: the suite
        run: python -m pytest -q
      - name: the independent oracle
        run: python tests/crosscheck.py
      - name: the shipped example profile really loads
        run: |
          python -m muezzin methods
          python -m muezzin times -c config/example.yaml --date 2027-01-01
          python -m muezzin next -c config/example.yaml --days 1
