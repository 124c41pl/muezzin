# The test suite is the contract: arithmetic, the YAML interface, the page's
# guards. None of it needs a speaker, a network or a Docker daemon, so it runs on
# a plain runner.
name: tests

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  pytest:
    name: pytest (${{ matrix.os }}, python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Three operating systems on purpose: this program is meant to run on
        # whichever machine a house already has, and the places they differ are
        # exactly the places a test should look - Windows has no system tzdata and
        # case-insensitive paths, macOS reaches a file through afplay rather than
        # winmm, Linux has whatever player the distro happens to carry.
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.10", "3.12"]
        exclude:
          - os: windows-latest
            python-version: "3.10"
          # one mac job is enough to prove the platform, not two
          - os: macos-latest
            python-version: "3.10"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .[dev]
      - name: the suite
        # Two macOS runs on 2026-11-12 showed 144 of 295 items taking about nine
        # minutes there, against under a minute on ubuntu, with no faulthandler
        # dump for any one test - the shape of a slow suite rather than of one
        # stuck test, though a block that never gives the interpreter back would
        # look the same from here. So: verbose, which names each test as it
        # finishes and leaves the answer in the log even if the step is killed,
        # plus a duration report. The limit stays so a hang ends the job.
        timeout-minutes: 30
        run: python -m pytest -v --durations=15
      - name: the independent oracle
        run: python tests/crosscheck.py
      - name: the shipped example profile really loads
        run: |
          python -m muezzin methods
          python -m muezzin times -c config/example.yaml --date 2027-01-01
          python -m muezzin next -c config/example.yaml --days 1
