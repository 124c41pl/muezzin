# A profile to look at, not to run: it writes to a folder instead of to a
# speaker, so it is safe everywhere, including inside a container.
# Copy it, set location, and replace the output with your own speakers.

location:
  latitude: 25.7123            # Tehran
  longitude: 51.0753
  timezone: Asia/Tehran

# Whether the page shows a map behind those numbers. osm is what you get by default:
# this daemon fetches each square once, keeps it in `muezzin-tiles/` beside this file,
# and credits the map on the page. Un-comment the line below to have no map, nothing
# asked of anybody, and the position drawn from the numbers alone. The times need
# neither: a grey square changes nothing else on the page.
# map_tiles: off

# Any of the 18 presets, or a preset with the angles you actually use.
# `muezzin methods` lists them; `muezzin times -c thisfile.yaml -d 2027-01-01`
# shows what they produce before anything is asked to speak.
method:
  preset: qom                 # fajr 19, isha 14, Jafari midnight
  isha_angle: 15

asr: standard                 # or: hanafi

# Display only: shifts the Hijri date the page shows, never a prayer time.
# The arithmetic calendar can sit a day either side of a sighting, so set this
# to whatever lines it up with the calendar you follow.
hijri_offset: 0

# Who to credit on the page. A credit should name a person, because a person is
# who answers when someone has a question about the code.
# attribution: "your name or handle"

media_dir: /app/media

# The only folder `kind: file` outputs may write into. Naming one root keeps a
# friendly-looking config from being a way to write anywhere on the machine.
out_dir: /app/out

outputs:
  - name: paper-trail
    kind: file                # writes a copy of what it would have played
    host: /app/out

  # A speaker muezzin has to find on the network is handed the recording a few
  # seconds before the time it belongs to, so the first note is already in the air
  # when that time arrives. The number comes from what this kind of speaker costs;
  # write it only to overrule that, and write 0 to start exactly on the minute.
  # For longer notice use offset_min on the event, which moves the printed time too.
  # - name: study
  #   kind: google_cast
  #   target: Study speaker
  #   lead_seconds: 8

events:
  - name: fajr-adhan
    at: fajr
    media: [test-tone.wav]
    targets: [paper-trail]
  - name: jumuah-reminder
    at: dhuhr                # the same Dhuhr, a different recording, once a week
    offset_min: -10
    days: [fri]
    media: [test-tone.wav]
    targets: [paper-trail]
